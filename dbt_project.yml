name: 'my_new_project'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  analysis_date: '2024-09-27'

models:
  my_new_project:
    # Bronze layer — raw landing models
    staging:
      +materialized: incremental
      +schema: bronze

    # Silver layer — cleaned/conformed models
    intermediate:
      +materialized: table
      +schema: silver

    # Gold layer — dimensional models (dims, facts, reporting views)
    marts:
      +schema: gold
      dimensions:
        +materialized: table
      facts:
        +materialized: table
      reporting:
        +materialized: view